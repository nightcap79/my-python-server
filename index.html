<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Server Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Python Server Test</h1>

        <button onclick="getHello()">Get Hello World</button>

        <div id="result">
            Waiting for server...
        </div>
    </div>

    <script>
        async function getHello() {
            const result = document.getElementById("result");

            result.textContent = "Connecting to server...";

            try {
                const response = await fetch("http://10.1.0.184:10000");

                if (!response.ok) {
                    throw new Error("Server returned " + response.status);
                }

                const text = await response.text();

                result.textContent = text;

            } catch (error) {
                result.textContent = "Error: " + error.message;
                console.error(error);
            }
        }
    </script>

</body>
</html>
